# 打 tag v* 时：构建 release APK（arm64-v8a）+ 交叉编译 worker，发布到同一个 GitHub Release。
#
# 需要的 Secrets：
#   ANDROID_KEYSTORE_BASE64   release 签名 keystore（base64 -w0 生成）
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   SERVER_CERT_PIN           deploy/scripts/gen-cert.sh 输出的 sha256/...
#   SERVER_BASE_URL           https://<服务器IP>:8443/api/v1
#
# 与 WS4 的约定：app/build.gradle.kts 从以下环境变量读取（本地 debug 可缺省）：
#   SIGNING_STORE_FILE / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD → signingConfigs.release
#   SERVER_CERT_PIN / SERVER_BASE_URL → BuildConfig 字段
#   VERSION_NAME（tag 去掉 v）/ VERSION_CODE（github.run_number）
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: assembleRelease
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVER_CERT_PIN: ${{ secrets.SERVER_CERT_PIN }}
          SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/dist/swufe-homework-${GITHUB_REF_NAME}-arm64-v8a.apk"
      - name: cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  worker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: windows, goarch: amd64, ext: .exe}
          - {goos: darwin,  goarch: arm64, ext: ""}
          - {goos: darwin,  goarch: amd64, ext: ""}
          - {goos: linux,   goarch: amd64, ext: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: worker/go.sum
      - name: build
        working-directory: worker
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$GITHUB_WORKSPACE/dist/swufe-worker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: [apk, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
