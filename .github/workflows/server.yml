name: server

on:
  pull_request:
    paths: ["server/**"]
  push:
    branches: [main]
    paths: ["server/**"]

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homework
          POSTGRES_PASSWORD: test
          POSTGRES_DB: homework_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homework" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: Asia/Shanghai
      TEST_DATABASE_URL: postgres://homework:test@localhost:5432/homework_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum
      # -p 1：多个包的集成测试共用同一个库（testdb 会清表），不能并行
      - run: go test -race -count=1 -p 1 ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: server

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/isaninebug/swufe-homework-server:latest
            ghcr.io/isaninebug/swufe-homework-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
