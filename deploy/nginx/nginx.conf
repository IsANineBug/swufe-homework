worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # 日志不记录请求体，也不记录 query（文件签名在 query 里）
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;
    # error log 会带完整请求行（含 /files 的签名 query），只记严重错误；限流拒绝不写日志
    error_log /var/log/nginx/error.log crit;

    # 按 IP 限流。校园网共用 NAT 出口，阈值放宽；精细限流在 server 内做
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream server_app {
        server server:8080;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:5m;

        client_max_body_size 11m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 直接用 TCP 对端地址覆盖，客户端伪造的 X-Real-IP / X-Forwarded-For 不会透传
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        location = /healthz {
            proxy_pass http://server_app/healthz;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://server_app;
        }

        # worker 长轮询 /worker/jobs/claim
        location /api/v1/worker/ {
            limit_req zone=api burst=50 nodelay;
            proxy_read_timeout 75s;
            proxy_pass http://server_app;
        }

        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_read_timeout 30s;
            proxy_pass http://server_app;
        }

        # 文件：server 校验过期签名后返回
        #   外部 URL：/files/<相对路径>?exp=<unix 秒>&sig=<HMAC-SHA256>，有效期 1 小时（api.yaml，裁决 #4-4）
        #   X-Accel-Redirect: /_protected/<相对 UPLOAD_DIR 的路径>
        # 由 nginx 从共享卷直接读文件，不经过 Go 进程
        location /files/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://server_app;
        }

        location /_protected/ {
            internal;
            alias /data/uploads/;
            # 缓存不超过签名有效期（1 小时）：取 10 分钟，签名临近过期时也不会多活太久
            add_header Cache-Control "private, max-age=600";
            add_header X-Content-Type-Options nosniff;
        }

        location / {
            return 404;
        }
    }
}
