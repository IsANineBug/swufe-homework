# swufe-homework 生产部署（2 核 2 GB）
# 用法：cd deploy && cp ../.env.example .env && 编辑 .env && docker compose up -d
# 镜像源可在 .env 里用 *_IMAGE 覆盖（国内源与替代方案见 deploy/README.md）。

name: swufe-homework

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homework}
      POSTGRES_USER: ${POSTGRES_USER:-homework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时开启 pg_trgm、btree_gist（迁移里也有 IF NOT EXISTS，双保险）
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homework} -d ${POSTGRES_DB:-homework}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      backend:
        ipv4_address: 172.28.0.20
    # 不对外暴露 5432

  # 一次性：把上传卷属主改成 server 镜像的非 root 用户（uid 10001），否则新建命名卷是 root:root 755
  uploads-init:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 10001:10001 /data/uploads && chmod 750 /data/uploads"]
    volumes:
      - uploads:/data/uploads
    network_mode: none
    restart: "no"

  server:
    # WS1/WS2 的镜像。默认从 GHCR 拉；拉不动时见 README「镜像替代方案」
    image: ${SERVER_IMAGE:-ghcr.io/isaninebug/swufe-homework-server:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      UPLOAD_DIR: /data/uploads
      GOMEMLIMIT: ${GOMEMLIMIT:-400MiB}
    volumes:
      - uploads:/data/uploads
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    networks:
      backend:
        ipv4_address: 172.28.0.30

  nginx:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8443}:8443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # 只读挂载上传目录，供 X-Accel-Redirect 内部转发
      - uploads:/data/uploads:ro
    mem_limit: 64m
    depends_on:
      - server
    networks:
      backend:
        # 固定地址：server 的 TRUSTED_PROXY 只信任它传来的 X-Real-IP
        ipv4_address: 172.28.0.10

volumes:
  pgdata:
  uploads:

networks:
  backend:
    # 若与云主机 VPC 网段冲突，见 README「改 Docker 网段」，同步改各 ipv4_address 和 TRUSTED_PROXY
    ipam:
      config:
        - subnet: 172.28.0.0/24
