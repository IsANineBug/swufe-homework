openapi: 3.1.0
info:
  title: swufe-homework API
  version: 0.1.0
  description: |
    西财作业 App 后端接口。需求见 docs/requirements.md。
    - 基础路径 /api/v1，HTTPS（IP+端口，自签证书，App 内固定公钥）。
    - 认证：Authorization: Bearer <access token>（15 分钟），用 refresh token 续期（30 天）。
    - 时间均为 ISO 8601，带 +08:00。业务时区 Asia/Shanghai。
    - 错误统一返回 Error；code 为机器可读字符串。
    - 「删除」在用户侧是删除，服务端为软删除，只有管理员（role=admin）可恢复。
servers:
  - url: https://{host}:{port}/api/v1
    variables:
      host: {default: 127.0.0.1}
      port: {default: "8443"}
security:
  - bearer: []

tags:
  - {name: auth, description: 注册、登录、找回}
  - {name: me, description: 我的信息、邀请、积分}
  - {name: timetable, description: 课表导入与班级}
  - {name: assignments, description: 作业、来源、完成状态}
  - {name: moderation, description: 合并、删除投票、谢谢}
  - {name: ai, description: AI 草稿（电脑在线时可用）}
  - {name: worker, description: 电脑端 worker 专用}
  - {name: admin, description: 管理员}

paths:
  /auth/campus-check:
    get:
      tags: [auth]
      security: []
      summary: 当前请求是否来自西财校园网出口 IP（配置项 CAMPUS_CIDRS）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: object, properties: {campus: {type: boolean}}, required: [campus]}

  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: 注册。邀请码或校园网 IP 满足其一即可
      parameters:
        - {name: X-Bootstrap-Token, in: header, required: false, schema: {type: string}, description: 仅首个用户注册管理员时使用}
      description: |
        无邀请码且不在校园网 → 403 need_invite_or_campus；给了邀请码但无效且不在校园网 → 403 invite_invalid。
        校园网注册 inviter_id 为空（邀请树根）。校园网与有效邀请码同时满足时按校园网注册，邀请码不消耗。
        recovery_code 只返回这一次。
        昵称 1–20 字；保留昵称（管理员、admin、官方、系统等，忽略大小写/全半角/空格比对）→ 400 nickname_reserved。
        库里还没有任何用户时，带请求头 X-Bootstrap-Token（= BOOTSTRAP_ADMIN_TOKEN）注册即成为管理员。
        同一 IP 每小时最多 30 次（可配置），超出 429 rate_limited。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, password]
              properties:
                nickname: {type: string, minLength: 1, maxLength: 20}
                password: {type: string, minLength: 8, maxLength: 64}
                invite_code: {type: [string, "null"]}
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tokens'
                  - type: object
                    properties:
                      recovery_code: {type: string, description: 形如 XXXX-XXXX-XXXX-XXXX，仅显示一次}
        "400": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}

  /auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, password]
              properties:
                nickname: {type: string}
                password: {type: string}
      description: 同一「昵称+IP」每小时最多失败 10 次，超出 429 rate_limited（成功登录不计数）。
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Tokens'}}}}
        "401": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}

  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: 用 refresh token 换新的一对 token；旧 refresh token 立即作废（轮换）
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Tokens'}}}}
        "401": {$ref: '#/components/responses/Error'}

  /auth/recover:
    post:
      tags: [auth]
      security: []
      summary: 用恢复码重设密码，并返回新的恢复码
      description: 成功后该用户所有设备下线（全部 refresh token 作废）。同一「昵称+IP」每小时最多失败 10 次，超出 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, recovery_code, new_password]
              properties:
                nickname: {type: string}
                recovery_code: {type: string}
                new_password: {type: string, minLength: 8}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: object, properties: {new_recovery_code: {type: string}}}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}

  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录。带 refresh_token 只注销本机；all=true 注销本人全部设备
      description: App 退出时带上本机的 refresh_token。两者都不给 → 400 bad_request。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: {type: string, description: 本机的 refresh token}
                all: {type: boolean, default: false, description: true = 注销全部设备}
      responses:
        "204": {description: 已注销}
        "400": {$ref: '#/components/responses/Error'}

  /meta:
    get:
      tags: [me]
      security: []
      summary: 当前学期与 12 节作息
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  semester: {$ref: '#/components/schemas/Semester'}
                  periods:
                    type: array
                    items: {type: object, properties: {no: {type: integer}, start: {type: string}, end: {type: string}}}
                  server_time: {type: string, format: date-time}

  /me:
    get:
      tags: [me]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
    patch:
      tags: [me]
      summary: 修改昵称、榜单匿名
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: {type: string, description: 规则同注册（1–20 字，不可用保留昵称）}
                leaderboard_anonymous: {type: boolean}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        "400": {$ref: '#/components/responses/Error', description: bad_nickname / nickname_reserved}
        "409": {$ref: '#/components/responses/Error', description: nickname_taken}

  /me/invites:
    get:
      tags: [me]
      summary: 我的邀请码及使用情况（剩余名额 = 5 − 已生成的码数，未使用的码也占）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining: {type: integer}
                  codes:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string}
                        used_by_nickname: {type: [string, "null"]}
                        used_at: {type: [string, "null"], format: date-time}
    post:
      tags: [me]
      summary: 生成一个邀请码（未使用的码也占名额）
      responses:
        "201": {description: ok, content: {application/json: {schema: {type: object, properties: {code: {type: string}}}}}}
        "403": {$ref: '#/components/responses/Error'}

  /me/points:
    get:
      tags: [me]
      summary: 积分明细与汇总
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  semester_total: {type: integer}
                  today_earned: {type: integer, description: 今日已得正分，上限 30}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PointsEntry'}
                  next_cursor: {type: [string, "null"]}

  /me/notices:
    get:
      tags: [me]
      summary: 站内通知（合并请求、禁发、邀请人违规提醒、规则公告）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Notice'}}

  /me/classes:
    get:
      tags: [timetable]
      summary: 我加入的班级（含时段），用于课表页
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Class'}}

  /me/classes/{class_id}:
    delete:
      tags: [timetable]
      summary: 「不是我的班」——退出该班
      description: 退出会被记住：之后导入课表不会自动加回（出现在 import 返回的 skipped 里），可用 POST /classes/{class_id}/join 手动加入。
      parameters: [{$ref: '#/components/parameters/ClassId'}]
      responses: {"204": {description: 已退出}}

  /timetable/import:
    post:
      tags: [timetable]
      summary: 提交用户确认后的课表，服务器自动归班
      description: |
        规则（全自动，不弹窗）：
        1. 本次提交中同名的时段合成一个班；
        2. 课名相同，且任一时段「教室+星期+节次」与已有班重叠 → 加入该班，并补全该班缺的时段；
        3. 都不重叠 → 新建班，提交者为第一个成员；
        4. 同一组时段命中两个已有班 → 两班自动合并（成员、时段、作业归到较早创建的班）。
           合并记录在 class_merges，管理员可撤销（撤销接口归管理员接口）。
        时段重叠但课名不同（多为识别错误）→ 返回 conflicts，该组不入库，由用户改名后重提。
        截断课名（truncated=true）：
        - 本次提交中，截断名与某完整课名相同或恰为唯一一个完整课名的前缀 → 并入该组；能匹配多个完整课名时单独成组；
        - 只能用于加入唯一一个同名班：命中两个及以上不同名的班 → 不合并，该组的命中全部进 conflicts，不入库。
        用户点过「不是我的班」的班不自动加回，放进 skipped。
        400 invalid_slot：时段不合法（星期 1–5、节次 1–12 且起节 ≤ 止节、课名/教室非空、最多 60 条）。
        409 no_semester：当前没有可导入的学期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  maxItems: 60
                  items: {$ref: '#/components/schemas/SlotInput'}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined: {type: array, items: {$ref: '#/components/schemas/Class'}}
                  created: {type: array, items: {$ref: '#/components/schemas/Class'}}
                  merged:
                    type: array
                    items: {type: object, properties: {from: {type: integer}, into: {type: integer}}}
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        slot: {$ref: '#/components/schemas/SlotInput'}
                        existing_class: {$ref: '#/components/schemas/Class'}
                  skipped:
                    type: array
                    description: 之前点过「不是我的班」的班，本次未加入
                    items: {$ref: '#/components/schemas/Class'}
        "400": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}

  /classes/search:
    get:
      tags: [timetable]
      summary: 手动录入时按课名模糊搜索（含被截断的前缀）
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Class'}}

  /classes/{class_id}:
    get:
      tags: [timetable]
      summary: 班级详情。已被自动合并的班返回保留班（id 不同），merged_from 为请求的 id；未合并时为 null
      parameters: [{$ref: '#/components/parameters/ClassId'}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Class'
                  - type: object
                    properties:
                      merged_from: {type: [integer, "null"]}
        "404": {$ref: '#/components/responses/Error'}

  /classes/{class_id}/join:
    post:
      tags: [timetable]
      summary: 手动加入当前学期的班（搜索结果里点加入；含退班后重新加入），幂等
      description: 已合并的班加入保留班。班不属于当前学期 → 409 class_archived。
      parameters: [{$ref: '#/components/parameters/ClassId'}]
      responses:
        "200": {description: 已加入, content: {application/json: {schema: {$ref: '#/components/schemas/Class'}}}}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}

  /classes/{class_id}/assignments:
    get:
      tags: [assignments]
      summary: 班级页，按日期查看
      description: |
        按 DDL 日期（Asia/Shanghai）筛选，from/to 含两端；默认今天前 7 天到后 60 天，范围最多 120 天，最多 500 条。
        班级成员或管理员可看；已合并的班按保留班返回。非成员 403 not_member。
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AssignmentSummary'}}
    post:
      tags: [assignments]
      summary: 新建作业（首发）
      description: |
        必须是班级成员（403 not_member）；禁发期内 403 post_banned；当天在该班已发 5 条（首发与补充合计，
        按 Asia/Shanghai 日期，被删除的不计）429 daily_limit。缺 ddl → 400 ddl_required（有图片时尤其必须）。
        attachment_ids 必须是本人上传、尚未使用的附件，否则 400 bad_attachment。班级不属于当前学期 409 class_archived。
        首发积分 +10 写 pending，24 小时后结算。发布前 App 应先调 /candidates。
      parameters: [{$ref: '#/components/parameters/ClassId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentCreate'}
      responses:
        "201": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        "400": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}

  /classes/{class_id}/assignments/candidates:
    post:
      tags: [assignments]
      summary: 发布前查重，最多 3 条（近 7 天、DDL ±1 天、标题相似度）
      description: |
        范围：本班近 7 天发布、在世未合并的作业；给了 ddl 时只看 DDL 前后 1 天内的。
        相似度：标题去掉空格、标点、大小写与全半角差异后的字符二元组 Dice 系数，≥ 0.3 才返回，按相似度降序。
        （中文标题下比 pg_trgm 稳定，且不依赖数据库 locale。）
      parameters: [{$ref: '#/components/parameters/ClassId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string}
                ddl: {type: [string, "null"], format: date-time}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/AssignmentSummary'}}

  /classes/{class_id}/leaderboard:
    get:
      tags: [moderation]
      description: |
        班级成员或管理员可看。周榜 = 本周一 00:00（Asia/Shanghai）起记入的已结算积分；学期榜 = 本班全部已结算积分（班级只属于一个学期）。
        rank 并列同名次；返回前 100 名，本人不在前 100 时额外附上本人一行。课代表 = 学期榜第一（> 0 分），同分取先达到者。
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
        - {name: scope, in: query, required: true, schema: {type: string, enum: [week, semester]}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  rep: {type: [object, "null"], description: 课代表（学期第一）, properties: {display_name: {type: string}}}
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: {type: integer}
                        display_name: {type: string, description: 匿名时为「匿名同学」}
                        points: {type: integer}
                        is_me: {type: boolean}

  /feed:
    get:
      tags: [assignments]
      summary: 首页：我所有班级的未过期作业，按 DDL 升序，含我的完成状态
      description: 当前学期、在班（未点「不是我的班」）的班级；DDL ≥ 现在；默认不含本人已完成的，最多 300 条。
      parameters:
        - {name: include_done, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AssignmentSummary'}}

  /sync:
    get:
      tags: [assignments]
      summary: 增量同步（用于本地提醒）。返回 since 之后变更的我班级的作业
      description: |
        不带 since：返回全部 DDL ≥ 现在 − 1 天的在世作业，removed_ids 为空。
        带 since：changed = updated_at > since 的在世作业（发布、补充、改标题/DDL、标红变化、合并进来、提醒文案写入都会刷新），
        以及本人在 since 之后标记完成的；removed_ids = since 之后被删除或被合并走的作业。
        返回的 now 比服务器时间早 30 秒，下次用它作 since；边界上的作业可能重复下发，按 id 覆盖即可。
        本人在别的设备「取消完成」不会出现在增量里（下次全量同步时纠正）。
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: {type: string, format: date-time}
                  changed: {type: array, items: {$ref: '#/components/schemas/AssignmentSummary'}}
                  removed_ids: {type: array, items: {type: integer}, description: 已删除或已合并走的作业}

  /assignments/{assignment_id}:
    get:
      tags: [assignments]
      description: 班级成员或管理员可看。已被合并的作业返回合并目标（id 不同，merged_from 含请求的 id）；已删除 404。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
    patch:
      tags: [assignments]
      summary: 首发者修改标题/DDL
      description: |
        只有首发者（created_by）可改，否则 403 forbidden。改 DDL 时首发来源的 stated_ddl 一并更新、
        重算标红（任一来源声称的 DDL 与作业 DDL 相差 ≥ 1 分钟即标红）、清空 reminder_text；未给 ddl_uncertain 时改 DDL 视为已确认。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                ddl: {type: string, format: date-time}
                ddl_uncertain: {type: boolean}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        "403": {$ref: '#/components/responses/Error'}

  /assignments/{assignment_id}/sources:
    post:
      tags: [assignments]
      summary: 给已有作业补充内容。stated_ddl 与作业 DDL 不一致时作业标红
      description: |
        须为班级成员；正文和附件不能都为空（400 bad_request）；禁发、每日 5 条同首发。补充积分 +3 写 pending，24 小时后结算。
        给已合并作业补充时自动加到合并目标上。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceCreate'}
      responses:
        "201": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
        "400": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}

  /assignments/{assignment_id}/done:
    put:
      tags: [assignments]
      summary: 标记完成（仅本人可见，停止提醒）
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      responses: {"204": {description: ok}}
    delete:
      tags: [assignments]
      summary: 取消完成（合并前在被合并作业上的完成记录一并取消）
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      responses: {"204": {description: ok}}

  /sources/{source_id}:
    patch:
      tags: [assignments]
      summary: 作者编辑自己的来源
      description: |
        只改给出的字段；给了 attachment_ids 则整体替换附件（去掉的附件解绑，24 小时后清理）。stated_ddl 变化会重算标红。
        非作者 403 forbidden。
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceCreate'}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
    delete:
      tags: [assignments]
      summary: 作者删除自己的来源（不扣分，但该来源积分作废）
      description: 幂等。作业没有剩余来源时随之删除（出现在 /sync 的 removed_ids）。作者删除的内容管理员不恢复。
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses:
        "204": {description: ok}
        "403": {$ref: '#/components/responses/Error'}

  /uploads:
    post:
      tags: [assignments]
      summary: 上传图片/附件（App 已压缩到约 1MB；服务器上限 10MB，生成缩略图）
      description: |
        按文件头识别类型，只收 JPEG、PNG、WebP（kind=image）和 PDF（kind=file），其他 415 bad_file_type；超过 10MB 413 too_large。
        图片生成宽 400px 的 JPEG 缩略图（超过 4000 万像素的不生成，thumb_url 为 null）。每人每小时最多 60 次，超出 429 rate_limited。
        附件 24 小时内未挂到作业或补充上会被清理。url / thumb_url 见 /files。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "201":
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        "413": {$ref: '#/components/responses/Error'}
        "415": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}

  /files/{path}:
    servers:
      - url: https://{host}:{port}
        variables:
          host: {default: 127.0.0.1}
          port: {default: "8443"}
    get:
      tags: [assignments]
      security: []
      summary: 下载附件（过期签名 URL，issue #4 裁决 4）
      description: |
        不在 /api/v1 下：url 形如 /files/<相对 UPLOAD_DIR 的路径>?exp=<unix 秒>&sig=<base64url(HMAC-SHA256)>，
        App 用服务器 origin（https://<IP>:<端口>）拼接。签名覆盖「路径 + 换行 + exp」，密钥 FILE_URL_SECRET（未设置时由 JWT_SECRET 派生）。
        有效期 1 小时（exp 取整到 10 分钟，便于缓存）；过期、签名不对、路径含 .. 一律 403。
        服务器验签后返回 X-Accel-Redirect: /_protected/<相对路径>，由 nginx 直接读文件（Cache-Control private, max-age=600）。
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}}
        - {name: exp, in: query, required: true, schema: {type: integer}}
        - {name: sig, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: 文件内容（经 nginx）}
        "403": {$ref: '#/components/responses/Error'}

  /sources/{source_id}/thanks:
    post:
      tags: [moderation]
      summary: 谢谢（不能谢自己，每人每条一次）
      description: |
        须为班级成员。谢自己 409 self_thanks，重复 409 already_thanked。作者立即 +1（每条来源谢谢分最多 10，计入每日 30 分上限，
        超出部分记 0 分）。
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses:
        "204": {description: ok}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}

  /sources/{source_id}/delete-votes:
    post:
      tags: [moderation]
      summary: 投票删除错误或虚假内容
      description: |
        门槛 = clamp(ceil(班级成员数 × 10%), 3, 6)。达到门槛即软删除，
        收回积分并扣 10 分；30 天内第 3 次被删 → 该班禁发 7 天；
        作者为邀请注册时通知其直接邀请人。
        须为班级成员；投自己的内容 409 self_vote（请直接删除），重复 409 already_voted。
        作者收到 content_deleted 通知，禁发时收到 ban 通知，邀请人收到 invitee_violation 通知。
        App 必须先弹出警示，确认按钮倒数 3 秒。
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  votes: {type: integer}
                  threshold: {type: integer}
                  deleted: {type: boolean}
        "409": {$ref: '#/components/responses/Error'}

  /merge-proposals:
    post:
      tags: [moderation]
      summary: 提议把 from 合并到 to（同一班级）
      description: |
        须为班级成员；两条作业都在世、未合并、同班（否则 409 merge_stale / 400）。同一对已有进行中的提议 409 already_proposed。
        提议人算第 1 票；from 的首发者收到 merge_request 通知。提议人就是 from 的首发者时视同同意，立即执行。
        7 天未执行自动 expired。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_id, to_id]
              properties:
                from_id: {type: integer}
                to_id: {type: integer}
      responses:
        "201": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/MergeProposal'}}}}
        "400": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}

  /merge-proposals/{proposal_id}/accept:
    post:
      tags: [moderation]
      summary: 被合并作业（from）的首发者同意，立即执行
      description: 提议已结束 409 merge_closed；作业已被删除或合并 409 merge_stale（提议随之 rejected）。
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/MergeProposal'}}}}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}

  /merge-proposals/{proposal_id}/votes:
    post:
      tags: [moderation]
      summary: 班级成员赞同；满 3 人执行
      description: |
        执行：搬来源（不删内容）、from 标记 merged_into、完成状态并集、
        DDL 不一致则 to 标红、积分按 points-rules 调整、推送 sync 变更。
        from 的首发者投赞同票等同 accept。重复投票 409 already_voted；其余错误同 accept。
        执行后同一 from 的其他进行中提议改为 expired，from 的首发者收到 merge_applied 通知。
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/MergeProposal'}}}}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}

  /ai/status:
    get:
      tags: [ai]
      summary: 电脑 worker 是否在线（离线时 App 置灰 AI 按钮）
      description: 任一 worker 最近一次心跳在 60 秒内即在线。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  online: {type: boolean}
                  last_seen: {type: [string, "null"], format: date-time}

  /ai/jobs:
    post:
      tags: [ai]
      summary: 发起 AI 任务；离线直接 409，不排队
      description: |
        各 kind 的 input 见 docs/ai-contract.md「App 传」：
        - parse_assignment：class_id 必填；{text?, attachment_ids?[≤6]}，至少一项
        - parse_timetable：{attachment_ids[1..2]}
        - dedupe_review：class_id 必填；{draft:{title, body, ddl?}, candidate_ids[1..3]}
        - spam_check：class_id 可选；{title, body, attachment_ids?[≤6]}
        图片只能传本人上传、未清理的 image 附件 id（issue #4 裁决 6），服务器签名后交给 worker；
        input 里出现未列出的字段（如 image_urls、context）返回 400 bad_input。
        ddl_conflict、reminder_text 只由服务器发起。class_id 指向已合并的班时按保留班处理。
        400 bad_input / bad_attachment；403 not_member；409 ai_offline；429 ai_busy（进行中 ≥ 3）/ ai_rate_limited（每小时 60）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, input]
              properties:
                kind: {type: string, enum: [parse_assignment, parse_timetable, dedupe_review, spam_check]}
                class_id: {type: [integer, "null"]}
                input: {type: object, description: 见 docs/ai-contract.md}
      responses:
        "202": {description: 已接收, content: {application/json: {schema: {$ref: '#/components/schemas/AiJob'}}}}
        "400": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}

  /ai/jobs/{job_id}:
    get:
      tags: [ai]
      summary: 轮询结果（建议每 1.5 秒，最多 2 分钟）
      description: 只能查自己发起的任务，别人的返回 404。不返回 input。任务结束 24 小时后删除（404）。
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/AiJob'}}}}
        "404": {$ref: '#/components/responses/Error'}

  /worker/heartbeat:
    post:
      tags: [worker]
      security: [{worker: []}]
      summary: 每 20 秒一次；超过 60 秒没有心跳视为离线
      parameters:
        - {$ref: '#/components/parameters/WorkerId'}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {worker_id: {type: string, maxLength: 64}, model: {type: string, maxLength: 100}}}
      responses:
        "204": {description: ok}
        "401": {$ref: '#/components/responses/Error'}

  /worker/jobs/claim:
    post:
      tags: [worker]
      security: [{worker: []}]
      summary: 长轮询领取任务（最长挂起 25 秒，无任务返回 204）
      description: 领取即标 running；返回的 input 已含服务器拼好的 context 和签名后的 image_urls（站内相对链接 /files/...）。
      parameters:
        - {$ref: '#/components/parameters/WorkerId'}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/AiJob'}}}}
        "204": {description: 暂无任务}

  /worker/jobs/{job_id}/result:
    post:
      tags: [worker]
      security: [{worker: []}]
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [done, failed]}
                output: {type: [object, "null"], description: done 时必填，≤ 64KB}
                error: {type: [string, "null"], description: failed 时的简短原因（≤ 300 字），不含作业正文}
      responses:
        "204": {description: ok}
        "400": {description: bad_output（不是 JSON 对象、过大，或 reminder_text 等写回输出不合格，此时任务记为 failed）, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "409": {description: job_not_running（已过期、已回传或未领取）, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /admin/sources/{source_id}/restore:
    post:
      tags: [admin]
      summary: 恢复误删内容，返还积分，可选解除禁发
      description: |
        只恢复被投票删除的内容（作者自删 409 not_restorable），幂等。清空该来源的删除票；作废的积分恢复
        （未到 24 小时的回到 pending），扣的 10 分写 restore_refund 返还；lift_ban 解除作者在该班的禁发。作者收到 content_restored 通知。
      parameters: [{$ref: '#/components/parameters/SourceId'}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {lift_ban: {type: boolean, default: true}}}
      responses: {"204": {description: ok}}

  /admin/merge-proposals/{proposal_id}/revert:
    post:
      tags: [admin]
      summary: 撤销合并（按 original_assignment_id 搬回来源）
      description: |
        按执行时记下的快照（merge_proposals.snapshot）还原：搬回来源、from 首发来源改回 first、首发积分恢复、
        合并时新记的补充分作废、合并时补上的完成状态去掉、两边重算标红。只能撤销 applied 的提议（否则 409 merge_closed）；
        目标作业之后又被合并走时 409 merge_chain，先撤销后一次。
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      responses:
        "204": {description: ok}
        "409": {$ref: '#/components/responses/Error'}

  /admin/class-merges:
    get:
      tags: [admin]
      summary: 最近 100 次班级自动合并（含已撤销），供复核（issue #4 裁决 10）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    from_class_id: {type: integer}
                    from_name: {type: string}
                    into_class_id: {type: integer}
                    into_name: {type: string}
                    triggered_by_nickname: {type: [string, "null"]}
                    created_at: {type: string, format: date-time}
                    undone_at: {type: [string, "null"], format: date-time}

  /admin/class-merges/{merge_id}/revert:
    post:
      tags: [admin]
      summary: 撤销班级自动合并
      description: |
        按 class_merges.snapshot 把时段、作业、积分流水、禁发记录、子合并班搬回 from，from 成员按快照重建，
        into 中因合并新增的成员移除、原成员恢复合并前状态，into 课名/教师恢复；两个班的作业刷新 updated_at 供 /sync。
        已撤销 409 merge_closed；into 之后又被合并走 409 merge_chain。
      parameters:
        - {name: merge_id, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: ok}
        "409": {$ref: '#/components/responses/Error'}

  /admin/deleted:
    get:
      tags: [admin]
      summary: 最近被投票删除的内容，供复核
      description: 最近 30 天、最多 200 条，按删除时间倒序；比普通 Source 多 assignment_id、deleted_at、deleted_reason。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Source'}}

  /admin/announcements:
    post:
      tags: [admin]
      summary: 发布规则变更公告（生效时间须 ≥ 7 天后）
      description: 不足 7 天 400 effective_too_soon。同时给所有未停用账号写一条 announcement 通知（/me/notices）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, effective_at]
              properties:
                title: {type: string}
                body: {type: string}
                effective_at: {type: string, format: date-time}
      responses:
        "201": {description: ok, content: {application/json: {schema: {type: object, properties: {id: {type: integer}}}}}}
        "400": {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    worker: {type: http, scheme: bearer, description: WORKER_TOKEN（仅电脑 worker）}

  parameters:
    ClassId: {name: class_id, in: path, required: true, schema: {type: integer}}
    AssignmentId: {name: assignment_id, in: path, required: true, schema: {type: integer}}
    SourceId: {name: source_id, in: path, required: true, schema: {type: integer}}
    ProposalId: {name: proposal_id, in: path, required: true, schema: {type: integer}}
    WorkerId: {name: X-Worker-Id, in: header, required: false, schema: {type: string, maxLength: 64}, description: worker 标识（排查用）}

  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [need_invite_or_campus, invite_invalid, nickname_taken, bad_credentials,
                     not_member, post_banned, daily_limit, ddl_required, already_voted,
                     self_thanks, ai_offline, ai_busy, ai_rate_limited, bad_input, bad_attachment, bad_output,
                     job_not_running, too_large, forbidden, not_found,
                     unauthorized, token_expired, bad_refresh_token, bad_recovery_code, bad_nickname,
                     bad_password, bad_request, rate_limited, invite_quota_exhausted, invalid_slot,
                     no_semester, nickname_reserved, class_archived, method_not_allowed, internal,
                     bad_attachment, bad_file_type, already_thanked, self_vote, already_proposed, merge_stale,
                     merge_closed, merge_chain, not_restorable, effective_too_soon]
        message: {type: string, description: 可直接展示的中文}

    Tokens:
      type: object
      description: |
        登录、注册、续期都返回新的一对 token。/auth/refresh 每次都轮换：返回新的 refresh_token，
        旧 refresh_token 立即作废（issue #4 裁决 7）。
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer, description: access token 有效秒数（900）}

    Semester:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date}
        archived: {type: boolean}

    Me:
      type: object
      properties:
        id: {type: integer}
        nickname: {type: string}
        role: {type: string, enum: [user, admin]}
        registered_via: {type: string, enum: [invite, campus, bootstrap]}
        leaderboard_anonymous: {type: boolean}
        invites_remaining: {type: integer, description: 5 − 已生成的码数（未使用的也占）}

    SlotInput:
      type: object
      required: [name, room, weekday, start, end]
      properties:
        name: {type: string}
        room: {type: string}
        weekday: {type: integer, minimum: 1, maximum: 5}
        start: {type: integer, minimum: 1, maximum: 12}
        end: {type: integer, minimum: 1, maximum: 12}
        truncated: {type: boolean, default: false}
        teacher: {type: [string, "null"]}

    Slot:
      type: object
      properties:
        room: {type: string}
        weekday: {type: integer}
        start: {type: integer}
        end: {type: integer}

    Class:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        teacher: {type: [string, "null"]}
        slots: {type: array, items: {$ref: '#/components/schemas/Slot'}}
        member_count: {type: integer}

    Attachment:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [image, file]}
        url: {type: string, description: "相对服务器根的签名地址 /files/…?exp=&sig=，1 小时内有效"}
        thumb_url: {type: [string, "null"], description: "同 url；PDF 和超大图片为 null"}
        bytes: {type: integer}

    AssignmentCreate:
      type: object
      required: [title, ddl]
      properties:
        title: {type: string, maxLength: 80}
        ddl: {type: string, format: date-time}
        ddl_uncertain: {type: boolean, default: false}
        body: {type: string, maxLength: 5000}
        attachment_ids: {type: array, maxItems: 6, items: {type: integer}}
        ai_job_id: {type: [integer, "null"], description: 若由 AI 草稿生成，便于追溯}

    SourceCreate:
      type: object
      properties:
        body: {type: string, maxLength: 5000}
        stated_ddl: {type: [string, "null"], format: date-time}
        attachment_ids: {type: array, maxItems: 6, items: {type: integer}}

    Source:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [first, supplement]}
        author_nickname: {type: string}
        body: {type: string}
        stated_ddl: {type: [string, "null"], format: date-time}
        attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        created_at: {type: string, format: date-time}
        thanks_count: {type: integer}
        thanked_by_me: {type: boolean}
        voted_delete_by_me: {type: boolean}
        assignment_id: {type: integer, description: 仅 /admin/deleted 返回}
        deleted_at: {type: string, format: date-time, description: 仅 /admin/deleted 返回}
        deleted_reason: {type: string, enum: [vote, admin], description: 仅 /admin/deleted 返回}

    AssignmentSummary:
      type: object
      properties:
        id: {type: integer}
        class_id: {type: integer}
        class_name: {type: string}
        title: {type: string}
        ddl: {type: string, format: date-time}
        ddl_uncertain: {type: boolean}
        ddl_conflict: {type: boolean, description: 标红}
        done: {type: boolean, description: 仅本人}
        source_count: {type: integer}
        reminder_text: {type: [object, "null"], description: "预生成文案 {2d|1d|12h: {title, body}}，可缺键；DDL 变更时清空，AI 重新生成后写回（见 ai-contract.md 第 6 节）"}
        updated_at: {type: string, format: date-time, description: /sync 增量依据}

    Assignment:
      allOf:
        - $ref: '#/components/schemas/AssignmentSummary'
        - type: object
          properties:
            first_poster_nickname: {type: string}
            sources: {type: array, items: {$ref: '#/components/schemas/Source'}}
            merged_from: {type: array, items: {type: integer}}
            pending_merges: {type: array, items: {$ref: '#/components/schemas/MergeProposal'}}

    MergeProposal:
      type: object
      description: votes 含提议人；首发者同意时不看票数。
      properties:
        id: {type: integer}
        from_id: {type: integer}
        to_id: {type: integer}
        status: {type: string, enum: [pending, applied, rejected, reverted, expired]}
        votes: {type: integer}
        needed_votes: {type: integer, const: 3}

    PointsEntry:
      type: object
      properties:
        delta: {type: integer}
        reason: {type: string, enum: [first_post, supplement, thanks, deleted_revoke, deleted_penalty, restore_refund, merge_adjust]}
        status: {type: string, enum: [pending, settled, void]}
        class_name: {type: string}
        assignment_title: {type: [string, "null"]}
        created_at: {type: string, format: date-time}

    Notice:
      type: object
      description: |
        kind：merge_request（有人提议合并你的作业）、merge_applied、content_deleted、content_restored、ban（禁发，payload.ends_at）、
        invitee_violation（你邀请的人内容被删，payload.invitee_nickname）、announcement（规则公告）。
      properties:
        id: {type: integer}
        kind: {type: string}
        payload: {type: object}
        created_at: {type: string, format: date-time}
        read: {type: boolean}

    AiJob:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string}
        status: {type: string, enum: [queued, running, done, failed, expired]}
        input: {type: object, description: 仅 worker 领取时返回}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: 创建后 2 分钟，到期未完成即 expired}
        output: {type: [object, "null"]}
        error: {type: [string, "null"]}
